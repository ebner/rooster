name: release
# Pushing a tag vX.Y.Z publishes the image to GHCR as X.Y.Z, X.Y, X and latest (08 §8), and
# attaches the CLI's single-file binaries to the GitHub release (07 §1), with LICENSE and
# THIRD-PARTY-NOTICES.txt.
#
# The binaries go straight to a draft release, the smoke jobs download them from it, and the
# release is published once everything passed. No Actions artifacts: they count against the
# account's storage quota, release assets don't. Running the workflow by hand with an existing
# tag redoes the binaries and the release only, without the image.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, vX.Y.Z (the CLI binaries and the release only)
        required: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    if: github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The self-hosted runners bring no Node of their own.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package.json ${version}"; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        run: >
          docker build -f docker/Dockerfile
          --build-arg ROOSTER_VERSION=${GITHUB_REF_NAME#v}
          --build-arg ROOSTER_GIT_SHA=${{ github.sha }}
          -t rooster:release .
      - name: smoke
        run: bash scripts/docker-smoke.sh rooster:release
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - name: push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag rooster:release "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  cli-binaries:
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: tag matches package version
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $TAG"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "$TAG" || { echo "tag $TAG != package.json ${version}"; exit 1; }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3 # scripts/licenses/Bun-LICENSE.md is this version's LICENSE.md
      - run: pnpm --filter @rooster/cli build
      - run: apps/cli/scripts/build-binaries.sh
      - uses: ./.github/actions/gh-cli
      - name: attach to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "See CHANGELOG.md"
          gh release upload "$TAG" apps/cli/dist/bin/* LICENSE THIRD-PARTY-NOTICES.txt --clobber

  cli-smoke:
    needs: cli-binaries
    permissions:
      # Reading a draft release's assets takes write access.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Linux x64 runs on the org's self-hosted scale set like the other jobs; arm64, macOS and
        # Windows need GitHub-hosted runners.
        include:
          - { os: self-hosted, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: windows-latest, target: windows-x64, ext: .exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      # The smoke script starts an in-memory server, which needs the server's dependencies.
      - run: pnpm install --frozen-lockfile
      - if: matrix.os == 'self-hosted'
        uses: ./.github/actions/gh-cli
      - name: smoke (--version, login --with-token, whoami)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$(node -p "require('./package.json').version")"
          bin="bin/rooster-${version}-${{ matrix.target }}${{ matrix.ext }}"
          gh release download "$TAG" --pattern "$(basename "$bin")" --dir bin
          chmod +x "$bin"
          apps/cli/scripts/smoke.sh "$PWD/$bin"

  cli-release:
    needs: [image, cli-smoke]
    # A manual run skips the image; the release still waits for every smoke test.
    if: ${{ !failure() && !cancelled() }}
    runs-on: self-hosted
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: ./.github/actions/gh-cli
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false
