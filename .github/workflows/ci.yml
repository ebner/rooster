name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The stages of scripts/ci.sh run as parallel jobs, so one run reports every failing stage. The e2e
# suite and its timing budgets run locally, in `pnpm release`, on the commit being released (ADR
# 0060); on shared 2-vCPU runners they failed mostly on runner load.
# Every job runs on self-hosted runners.
jobs:
  static:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the secret scan reads the whole history; .gitleaksignore pins commit fingerprints
      - uses: ./.github/actions/setup
      - run: bash scripts/ci.sh static

  unit:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bash scripts/ci.sh unit

  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup
      - run: bash scripts/ci.sh build

  docker:
    runs-on: self-hosted
    needs: [static, unit, build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        run: docker build -f docker/Dockerfile --build-arg ROOSTER_GIT_SHA=${{ github.sha }} -t rooster:ci .
      - name: smoke
        run: bash scripts/docker-smoke.sh rooster:ci
      # The drill's mock IdP and HTTP client run from the repo (Node 24 + the workspace deps).
      - uses: ./.github/actions/setup
      - name: backup drill
        run: bash scripts/backup-drill.sh rooster:ci
