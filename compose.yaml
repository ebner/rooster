# Example deployment. Copy .env.example (apps/server/.env.example) to .env and fill it in.
services:
  rooster:
    image: ghcr.io/201works/rooster:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      ROOSTER_TRUST_PROXY: "true"
    volumes:
      - rooster-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # or attach to your reverse proxy's network instead
volumes:
  rooster-data:
