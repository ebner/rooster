# Example deployment. Copy .env.example (apps/server/.env.example) to .env and fill it in.
services:
  rooster:
    image: ghcr.io/ebner/rooster:1
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # Every variable in .env reaches this container: keep other services' secrets (the
    # Litestream credentials) in their own files.
    env_file: .env
    environment:
      ROOSTER_TRUST_PROXY: "true"
      ROOSTER_DATA_DIR: /data   # the volume; overrides the template's local-dev ./data
    volumes:
      - rooster-data:/data
    ports:
      - "127.0.0.1:3000:3000"   # or attach to your reverse proxy's network instead
volumes:
  rooster-data:
