# Apache httpd 2.4 (mod_ssl, mod_proxy, mod_proxy_http, mod_headers, mod_rewrite, mod_setenvif).
# rooster sends its own CSP, HSTS, X-Frame-Options and Referrer-Policy: do not override them.
<VirtualHost *:80>
	ServerName rooster.example.com
	RewriteEngine On
	RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge [NC]
	RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
	ServerName rooster.example.com
	SSLEngine on
	SSLCertificateFile /etc/letsencrypt/live/rooster.example.com/fullchain.pem
	SSLCertificateKeyFile /etc/letsencrypt/live/rooster.example.com/privkey.pem

	ProxyRequests Off
	ProxyPreserveHost On
	RequestHeader set X-Forwarded-Proto "https"
	# Drop client-supplied X-Forwarded-For; mod_proxy then sets the real peer address
	# (rooster takes the right-most hop, ROOSTER_TRUSTED_PROXY_HOPS=1).
	RequestHeader unset X-Forwarded-For early

	# Server-Sent Events: flush every event, never compress, long-lived.
	SetEnvIf Request_URI "^/api/v1/events" no-gzip=1
	ProxyPass        /api/v1/events http://127.0.0.1:3000/api/v1/events flushpackets=on timeout=3600
	ProxyPassReverse /api/v1/events http://127.0.0.1:3000/api/v1/events
	# Remote MCP (P9): answers may stream as text/event-stream, so flush them the same way.
	SetEnvIf Request_URI "^/mcp$" no-gzip=1
	ProxyPass        /mcp http://127.0.0.1:3000/mcp flushpackets=on timeout=600
	ProxyPassReverse /mcp http://127.0.0.1:3000/mcp

	ProxyPass        / http://127.0.0.1:3000/
	ProxyPassReverse / http://127.0.0.1:3000/
</VirtualHost>
