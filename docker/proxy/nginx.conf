server {
  listen 443 ssl http2;
  server_name rooster.example.com;
  # ssl_certificate / ssl_certificate_key ...

  # Uploads (P10): attachments up to ROOSTER_UPLOAD_MAX_MB (default 25 MB) plus multipart
  # framing, avatars up to 2 MB. rooster enforces its own limits; keep this above the upload
  # limit (raise both together).
  client_max_body_size 30m;

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # never pass on a client-supplied chain
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Server-Sent Events: never buffer, long read timeout.
  location /api/v1/events {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # never pass on a client-supplied chain
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  # Remote MCP (P9): answers may stream as text/event-stream.
  location = /mcp {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;  # never pass on a client-supplied chain
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 10m;
  }
}
