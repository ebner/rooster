<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="rooster: a calm, keyboard-first task manager." />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!-- 02 §13.5: standalone on iOS with the default (dark-on-white) status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="rooster" />
    <title>rooster</title>
  </head>
  <body>
    <!-- 03 §2.10: the logo holds the screen until the app's first render replaces it. -->
    <div id="root">
      <div
        style="position: fixed; inset: 0; display: grid; place-items: center; background: var(--color-bg-subtle, #f6f7f9)"
      >
        <img src="/icons/logo-stack.svg" alt="rooster" width="119" height="96" style="width: 7.4rem; height: auto" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
